openapi: 3.0.3
info:
  title: Slow Horses Rooms API
  version: 0.1.0
  description: |
    Boilerplate Go API backed by MongoDB. Five endpoints exist to prove the
    setup works end to end.

    Note: `roomUrl` acts as the invite secret. `POST /join` only adds a
    participant when both `id` and `roomUrl` match the stored room.
servers:
  - url: http://localhost:5000
    description: Local docker compose
  - url: http://localhost:5001
    description: Local docker compose with API_HOST_PORT=5001 (e.g. macOS AirPlay owns 5000)

tags:
  - name: health
  - name: rooms

paths:
  /ping:
    get:
      tags: [health]
      summary: Liveness check
      description: Returns OK as plain text if the server is up. Does not touch MongoDB.
      responses:
        "200":
          description: Server is up
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /rooms:
    get:
      tags: [rooms]
      summary: List all rooms
      responses:
        "200":
          description: Every room in the collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "500":
          $ref: "#/components/responses/Error"

  /room:
    put:
      tags: [rooms]
      summary: Create a room
      description: |
        `id` and `roomUrl` are generated by the server and ignored if supplied.
        Uses PUT rather than POST to match the agreed contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
            example:
              name: Friday Night Table
              eventId: evt-2026-09-01
              isStarted: false
              isFilled: false
              participants: []
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid body, or missing name / eventId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /room/{id}:
    delete:
      tags: [rooms]
      summary: Delete a room by id
      parameters:
        - name: id
          in: path
          required: true
          description: Room UUID
          schema:
            type: string
            format: uuid
          example: 11111111-1111-4111-8111-111111111111
      responses:
        "204":
          description: Room deleted
        "400":
          description: Missing id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No room with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /join:
    post:
      tags: [rooms]
      summary: Join a room using an invite
      description: |
        Adds a participant to the room identified by `id`, but only when the
        supplied `roomUrl` matches the room's stored invite URL and the room is
        not already filled. A rejected join never writes to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
            example:
              id: 11111111-1111-4111-8111-111111111111
              roomUrl: http://localhost:5000/join/11111111-1111-4111-8111-111111111111
              name: Alice
              balance:
                usd: 100
                chips: 20
      responses:
        "200":
          description: Participant added; returns the updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid body, or missing id / roomUrl / name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: roomUrl does not match this room's invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No room with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Room is already filled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /openapi.yaml:
    get:
      tags: [health]
      summary: This specification
      description: The spec embedded in the binary, for external tooling.
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string

components:
  responses:
    Error:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Participant:
      type: object
      required: [name, balance]
      properties:
        name:
          type: string
          example: Alice
        balance:
          type: object
          additionalProperties: true
          description: Free-form object; whatever the client sends is stored as-is.
          example:
            usd: 100
            chips: 20

    Room:
      type: object
      required: [id, name, participants, isFilled, isStarted, eventId, roomUrl]
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        name:
          type: string
          example: Friday Night Table
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        isFilled:
          type: boolean
          example: false
        isStarted:
          type: boolean
          example: false
        eventId:
          type: string
          example: evt-2026-09-01
        roomUrl:
          type: string
          format: uri
          example: http://localhost:5000/join/11111111-1111-4111-8111-111111111111

    CreateRoomRequest:
      type: object
      required: [name, eventId]
      properties:
        name:
          type: string
        eventId:
          type: string
        isFilled:
          type: boolean
          default: false
        isStarted:
          type: boolean
          default: false
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"

    JoinRequest:
      type: object
      required: [id, roomUrl, name]
      properties:
        id:
          type: string
          format: uuid
          description: Room id from the invite
        roomUrl:
          type: string
          format: uri
          description: Invite URL; must match the room's stored roomUrl
        name:
          type: string
        balance:
          type: object
          additionalProperties: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: room not found
